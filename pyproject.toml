[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terngram"
version = "0.1.0"
description = "A native Telegram client for Tern"
requires-python = ">=3.12"
dependencies = ["telethon>=1.40,<2"]

[project.scripts]
terngram = "terngram.__main__:main"

[tool.setuptools.packages.find]
include = ["terngram*"]

[tool.setuptools.package-data]
terngram = ["ui/*.ts"]
