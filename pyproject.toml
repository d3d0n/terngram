[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terngram"
version = "0.1.3"
description = "A native Telegram client for Tern"
requires-python = ">=3.12"
dependencies = ["qrcode[pil]>=8.2,<9"]

[project.scripts]
terngram = "terngram.__main__:main"

[tool.setuptools.packages.find]
include = ["terngram*"]

[tool.setuptools.package-data]
terngram = ["ui/*.ts"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Adopt runtime-error checks without a checkout-wide style migration.
select = ["E9", "F63", "F7", "F82"]
